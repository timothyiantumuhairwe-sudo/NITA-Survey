<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width",initial scale="1.0">
        <title>Uganda National IT Skills Assessment 2026</title>
          <link rel="stylesheet" href="survey.css">
    </head>
    <body>
        <header class="header">
            <img src="uganda-coat-of-arms.png"
              alt="Uganda coat of Arms"
              style="max-width:80px;">
                <h1>National Information Technology Authority - Uganda</h1>
        </header>
        <section class="banner">
          <img src="survey-banner.JPEG" alt="Uganda National IT Skills Assessment Banner">
       <div class="banner-overlay">
          <h2>Uganda National IT Skills Assessment 2026</h2>
          </div>
        </section>
          <section class="progress">
              <div class="step active">
                  <span>1</span>
                   <p>Respondent Details</p>
                    </div>
                <div class="step">
                    <span>2</span>
                     <p>Skills Assessment</p> 
                  </div>
                    <div class="step">
                        <step>3</step>
                        <p>Submit</p>
                    </div>  
        </section>
        <section class="survey-form">
            <h2>Respondent Details</h2>
              <form>
                   <fieldset>
                     <legend>Respondent Details</legend>
                <div class="form-group">
                    <label for="title">Title</label>
                  <select id="title" name="title">
                         <option value="">Select Title</option> 
                           <option>Mr</option>
                           <option>Mrs</option>
                           <option>Ms</option>
                           <option>Dr</option>
                             </select>
                         </div>
                   <div class="form-group">
                    <label for="fullname">Full Name</label>
                       <input type="text"
                        id="fullname"
                        name="fullname"
                         required
                         minlength="4"
                     placeholder="Enter your full name">
                   </div> 
                <div class="form-group">
                    <label for="email">Email Adress</label>   
                <input type="email" 
                       id="email"  
                       name="email" 
                       required
                 placeholder="example@email.com">     
                </div>        
       <!--Phone-->
         <div class="form-group">
              <label for="phone">Phone Number</label>
         <input type="tel"
                  id="phone"
                name="phone"
                pattern="\+256700000">
          </div>
        <div class="form-group">
            <label for="dob">Date of Birth</label>
              <input type="date"
                    id="dob"
                    name="dob">
               </div>
            <div class="form-group">
           <label>Gender</label>
               <div class="radio-group">
                <label>
                    <input type="radio" name="gender" value="Male">
                    Male
                </label>  
             <label>
                <input type="radio" name="gender" value="Prefer not to say">
                Prefer not to say
             </label>  
          </div>
          </div>
       <div class="form-group">
         <label for="region">Region</label>
              <select id="region" name="region">
                <option value="">Select Region</option>
                <option>Central</option>
                <option>Eastern</option>
                <option>Northern</option>
                <option>Western</option>
                  </select>
                </div>
              <div class="form-group">
            <label>Respondent Category</label>    
           <div class="radio-group">
         <label>
           <input type="radio" name="category" value="ICT Proffesional">
        ICT Professional
        </label>
        
        <label>
            <input type="radio" name="category" value="Government Officer">
            Government Officer
        </label>
                <label>
                    <input type="radio" name="category" value="Student">
                Student
              </label>
          </div>
         </div>
      </fieldset>
      </form>
    </section> 
      </body>
     </html>
